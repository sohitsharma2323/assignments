<!DOCTYPE html>
<html>
<head>
    <title>Styled Lists</title>
    <link rel="stylesheet" href="7.css">
</head>

<body>

    <h1>My Lists</h1>

    <h2>Unordered List</h2>

    <ul class="custom-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Java</li>
    </ul>


    <h2>Ordered List</h2>

    <ol class="number-list">
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
        <li>Build a Website</li>
    </ol>

</body>
</html>
