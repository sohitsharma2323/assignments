<!DOCTYPE html>
<html>
<head>
    <title>Div and Span</title>
    <link rel="stylesheet" href="10.css">
</head>

<body>

    <h1>Div and Span Example</h1>

    <div class="paragraph">
        HTML is used to create the
        <span class="highlight">structure</span>
        of a web page. CSS is used to add
        <span class="highlight">style</span>
        and make the website
        <span class="highlight">beautiful</span>.
    </div>

    <h2>Block Display</h2>

    <div class="block">Block 1</div>
    <div class="block">Block 2</div>

    <h2>Inline-Block Display</h2>

    <div class="inline-block">Box 1</div>
    <div class="inline-block">Box 2</div>
    <div class="inline-block">Box 3</div>

</body>
</html>
